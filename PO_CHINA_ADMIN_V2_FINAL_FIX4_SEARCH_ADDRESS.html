function closeMenu(){document.querySelector('.side')?.classList.remove('open');document.getElementById('drawerOverlay')?.classList.remove('show')}
function page(p){closeMenu();document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active')); [...document.querySelectorAll('.nav button')].find(b=>b.getAttribute('onclick')?.includes("'"+p+"'"))?.classList.add('active'); ({dashboard,customers,orders,productSearch,payments,reports,batches}[p])()}

function customerName(id){return db.customers.find(c=>c.id===id)?.name||'—'}
function batchName(id){return db.batches.find(b=>b.id===id)?.name||'Tanpa Batch'}
function batchCount(id){return db.orders.filter(o=>o.batchId===id).length}
function batchOptions(selected=''){return db.batches.map(b=>`<option value="${b.id}" ${b.id===selected?'selected':''}>${esc(b.name)}</option>`).join('')}
async function loadDB(){
 const [b,c,o,i,p]=await Promise.all([
  sb.from('batches').select('*').order('batch_date',{ascending:false}),
  sb.from('customers').select('*').order('name'),
  sb.from('orders').select('*').order('created_at',{ascending:true}),
  sb.from('order_items').select('*').order('created_at',{ascending:true}),
  sb.from('payments').select('*').order('payment_date',{ascending:true})
 ]);
 for(const r of [b,c,o,i,p]) if(r.error) throw r.error;
 const itemsBy={};
 (i.data||[]).forEach(x=>{(itemsBy[x.order_id]??=[]).push({id:x.id,code:x.product_code||'',color:x.color||'',size:x.size||'',qty:Number(x.qty_ordered||0),price:Number(x.price||0),discount:Number(x.discount||0),received:Number(x.qty_received||0),supplierOrdered:!!x.supplier_ordered,note:x.note||''})});
 db.batches=(b.data||[]).map(x=>({id:x.id,name:x.name||'',date:x.batch_date||'',note:x.note||''}));
 db.customers=(c.data||[]).map(x=>({id:x.id,name:x.name||'',wa:x.whatsapp||'',address:x.address||'',note:x.note||''}));
 db.orders=(o.data||[]).map(x=>({id:x.id,customerId:x.customer_id,batchId:x.batch_id||'',invoice:x.invoice||'',orderDate:x.order_date||'',items:itemsBy[x.id]||[],dpAmount:Number(x.dp_amount||0),shipping:Number(x.shipping_amount||0),note:x.note||'',receivedSet:!!x.received_set}));
 db.payments=(p.data||[]).map(x=>({id:x.id,orderId:x.order_id,amount:Number(x.amount||0),date:x.payment_date||x.created_at||new Date().toISOString(),note:x.note||'',paymentType:x.payment_type||'PELUNASAN',autoDp:x.payment_type==='DP'}));
}
function paidFor(oid){return db.payments.filter(p=>p.orderId===oid).reduce((a,p)=>a+Number(p.amount||0),0)}
function orderTotals(o){let items=o.items||[];let gross=items.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||0),0);let discount=items.reduce((s,i)=>s+Math.min(Number(i.discount||0),Number(i.price||0)*Number(i.qty||0)),0);let base=Math.max(0,gross-discount);let adjustment=o.receivedSet?items.reduce((s,i)=>{let q=Number(i.qty||0),r=Math.max(0,Math.min(q,Number(i.received??q)));let netUnit=q?Math.max(0,(Number(i.price||0)*q-Math.min(Number(i.discount||0),Number(i.price||0)*q))/q):0;return s+netUnit*(r-q)},0):0;let shipping=Number(o.shipping||0);return {gross,discount,base,adjustment,shipping,total:Math.max(0,base+adjustment+shipping)}}
function status(o){let t=orderTotals(o),p=paidFor(o.id);if(t.total===0)return ['Menunggu','warn'];if(p>=t.total)return ['Lunas',''];if(p>0)return ['DP','warn'];return ['Belum Bayar','red']}
async function loginAdmin(){
 const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value,err=document.getElementById('loginError');err.style.display='none';
 if(!email||!password){err.textContent='Email dan password wajib diisi.';err.style.display='block';return}
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error){err.textContent=error.message||'Login gagal.';err.style.display='block';return}
 try{currentUser=data.user;await loadDB();document.getElementById('loginScreen').style.display='none';document.getElementById('appShell').style.display='flex';page('dashboard')}catch(e){await sb.auth.signOut();err.textContent='Login berhasil, tetapi database belum bisa diakses: '+e.message;err.style.display='block'}
}
async function logoutAdmin(){await sb.auth.signOut();location.reload()}
sb.auth.onAuthStateChange(async(_event,session)=>{if(session&&!currentUser){currentUser=session.user;try{await loadDB();document.getElementById('loginScreen').style.display='none';document.getElementById('appShell').style.display='flex';page('dashboard')}catch(e){console.error(e)}}});
function newCustomer(){customerForm()} function editCustomer(id){customerForm(db.customers.find(c=>c.id===id))}
function newOrder(){if(!db.customers.length){alert('Buat customer dulu.');pendingOrder=true;newCustomer();return}pendingOrder=false;orderForm()}
function nextInvoice(){
 let d=new Date(),m=String(d.getMonth()+1).padStart(2,'0'),y=String(d.getFullYear()).slice(-2);
 let prefix=`INV/${m}${y}/`, max=0;
 (db.orders||[]).forEach(o=>{
   let inv=String(o.invoice||'');
   if(inv.startsWith(prefix)){
     let n=parseInt(inv.slice(prefix.length),10);
     if(Number.isFinite(n)) max=Math.max(max,n);
   }
 });
 return `${prefix}${String(max+1).padStart(3,'0')}`;
}

async function saveCustomer(id){let c={id:id||crypto.randomUUID(),name:f_name.value.trim(),wa:f_wa.value.trim(),address:f_addr.value.trim()};if(!c.name)return alert('Nama wajib diisi.');const {error}=await sb.from('customers').upsert({id:c.id,name:c.name,whatsapp:c.wa,address:c.address});if(error)return alert('Gagal menyimpan customer: '+error.message);let i=db.customers.findIndex(x=>x.id===c.id);if(i<0)db.customers.push(c);else db.customers[i]=c;modal.classList.remove('show');if(pendingOrder){pendingOrder=false;orderForm()}else customers()}

async function saveBatch(id){let name=document.getElementById('b_name').value.trim();if(!name)return alert('Nama batch wajib diisi.');let date=document.getElementById('b_date').value;let b={id:id||crypto.randomUUID(),name,date};const {error}=await sb.from('batches').upsert({id:b.id,name:b.name,batch_date:b.date});if(error)return alert('Gagal menyimpan batch: '+error.message);let ix=db.batches.findIndex(x=>x.id===b.id);if(ix<0)db.batches.push(b);else db.batches[ix]=b;modal.classList.remove('show');batches()}
async function deleteBatch(id){if(db.orders.some(o=>o.batchId===id))return alert('Batch ini masih dipakai oleh order. Pindahkan order ke batch lain dulu.');if(confirm('Hapus batch ini?')){const {error}=await sb.from('batches').delete().eq('id',id);if(error)return alert('Gagal menghapus batch: '+error.message);db.batches=db.batches.filter(b=>b.id!==id);batches()}}
async function saveOrder(id){let items=[...document.querySelectorAll('#items .itemrow')].map(r=>({code:r.querySelector('.it_code').value.trim(),color:r.querySelector('.it_color').value.trim(),size:r.querySelector('.it_size').value.trim(),qty:Number(r.querySelector('.it_qty').value||0),price:Number(r.querySelector('.it_price').value||0),discount:Number(r.querySelector('.it_discount').value||0)})).filter(i=>i.code&&i.qty>0);if(!items.length)return alert('Minimal 1 barang.');let oldOrder=id?db.orders.find(x=>x.id===id):null;let o={id:id||crypto.randomUUID(),customerId:o_customer.value,batchId:o_batch.value||null,invoice:o_invoice.value.trim(),items,dpAmount:Number(o_dp.value||0),shipping:Number(o_shipping.value||0),note:o_note.value.trim(),receivedSet:oldOrder?oldOrder.receivedSet:false};o.items=o.items.map((ni,k)=>{let old=oldOrder?.items?.[k];return {...ni,received:old?.received??0,supplierOrdered:old?.supplierOrdered??false,discount:Math.min(Math.max(0,ni.discount||0),Math.max(0,ni.price*ni.qty))}});let {error}=await sb.from('orders').upsert({id:o.id,invoice:o.invoice,customer_id:o.customerId,batch_id:o.batchId,order_date:oldOrder?.orderDate||new Date().toISOString().slice(0,10),dp_amount:o.dpAmount,shipping_amount:o.shipping,note:o.note,received_set:o.receivedSet});if(error)return alert('Gagal menyimpan order: '+error.message);({error}=await sb.from('order_items').delete().eq('order_id',o.id));if(error)return alert('Gagal memperbarui barang order: '+error.message);const rows=o.items.map(i=>({id:crypto.randomUUID(),order_id:o.id,product_code:i.code,color:i.color,size:i.size,qty_ordered:i.qty,qty_received:i.received??0,supplier_ordered:i.supplierOrdered??false,price:i.price,discount:i.discount||0,note:null}));({error}=await sb.from('order_items').insert(rows));if(error)return alert('Gagal menyimpan barang order: '+error.message);const auto=db.payments.find(p=>p.orderId===o.id&&p.autoDp);if(o.dpAmount>0){if(auto){({error}=await sb.from('payments').update({amount:o.dpAmount,payment_type:'DP',note:'DP dari input order'}).eq('id',auto.id))}else{({error}=await sb.from('payments').insert({id:crypto.randomUUID(),order_id:o.id,payment_date:new Date().toISOString(),amount:o.dpAmount,payment_type:'DP',note:'DP dari input order'}))}if(error)return alert('Gagal menyimpan DP: '+error.message)}else if(auto){({error}=await sb.from('payments').delete().eq('id',auto.id));if(error)return alert('Gagal menghapus DP: '+error.message)}await loadDB();modal.classList.remove('show');orders()}
async function saveReceived(id){let o=db.orders.find(x=>x.id===id);document.querySelectorAll('.recv').forEach(x=>o.items[x.dataset.i].received=Math.max(0,Math.min(o.items[x.dataset.i].qty,Number(x.value||0))));o.receivedSet=true;let {error}=await sb.from('orders').update({received_set:true}).eq('id',id);if(error)return alert('Gagal menyimpan status barang datang: '+error.message);for(const i of o.items){const r=await sb.from('order_items').update({qty_received:i.received}).eq('id',i.id);if(r.error)return alert('Gagal menyimpan qty diterima: '+r.error.message)}await loadDB();modal.classList.remove('show');editOrder(id)}
async function deleteOrder(id){let o=db.orders.find(x=>x.id===id);if(!o)return;if(!confirm('Hapus order '+o.invoice+'?\n\nOrder, item barang, dan riwayat pembayaran order ini akan dihapus permanen.'))return;let r=await sb.from('payments').delete().eq('order_id',id);if(r.error)return alert('Gagal menghapus pembayaran order: '+r.error.message);r=await sb.from('order_items').delete().eq('order_id',id);if(r.error)return alert('Gagal menghapus item order: '+r.error.message);r=await sb.from('orders').delete().eq('id',id);if(r.error)return alert('Gagal menghapus order: '+r.error.message);db.orders=db.orders.filter(x=>x.id!==id);db.payments=db.payments.filter(x=>x.orderId!==id);orders()}
async function savePayment(id){let a=Number(payAmount.value||0);if(a<=0)return alert('Nominal harus lebih dari 0.');const {error}=await sb.from('payments').insert({id:crypto.randomUUID(),order_id:id,payment_date:new Date().toISOString(),amount:a,payment_type:'PELUNASAN',note:payNote.value});if(error)return alert('Gagal menyimpan pembayaran: '+error.message);await loadDB();modal.classList.remove('show');editOrder(id)}
function dashboard(){
 let total=db.orders.length, paid=0, dp=0, unpaid=0, ready=0, short=0;
 db.orders.forEach(o=>{let s=status(o)[0]; if(s==='Lunas')paid++; else if(s==='DP')dp++; else unpaid++; if(o.receivedSet)ready++; if(o.receivedSet&&(o.items||[]).some(i=>Number(i.received??i.qty)<Number(i.qty)))short++;});
 document.getElementById('app').innerHTML=`<div class="top"><div><h1>Dashboard 👋</h1><p>Ringkasan PO & pembayaran hari ini.</p></div><button class="btn" onclick="newOrder()">＋ Buat Order</button></div>
 <div class="grid">
  <div class="stat"><div class="label">Total Order</div><strong>${total}</strong></div>
  <div class="stat"><div class="label"><i class="dot"></i>Lunas</div><strong>${paid}</strong></div>
  <div class="stat"><div class="label"><i class="dot yellow"></i>DP</div><strong>${dp}</strong></div>
  <div class="stat"><div class="label"><i class="dot red"></i>Belum Bayar</div><strong>${unpaid}</strong></div>
 </div>
 <div class="section grid">
  <div class="stat"><div class="label">Customer</div><strong>${db.customers.length}</strong></div>
  <div class="stat"><div class="label">Barang Ready</div><strong>${ready}</strong></div>
  <div class="stat"><div class="label">Ada Kekurangan</div><strong>${short}</strong></div>
  <div class="stat"><div class="label">Total Nilai PO</div><strong>${rupiah(db.orders.reduce((s,o)=>s+orderTotals(o).total,0))}</strong></div>
 </div>
 <div class="section card"><h3 style="margin-top:0">Status Order Terbaru</h3><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Total</th><th>Bayar</th><th>Status</th><th></th></tr></thead><tbody>
 ${db.orders.slice().reverse().slice(0,12).map(o=>{let t=orderTotals(o),s=status(o);return `<tr><td>${esc(o.invoice)}</td><td>${esc(customerName(o.customerId))}</td><td>${rupiah(t.total)}</td><td>${rupiah(paidFor(o.id))}</td><td><span class="pill ${s[1]}">${s[0]}</span></td><td><button class="btn secondary" onclick="editOrder('${o.id}')">Buka</button></td></tr>`}).join('')||`<tr><td colspan="6" class="empty">Belum ada order.</td></tr>`}
 </tbody></table></div></div>`;
}

function orders(){
 document.getElementById('app').innerHTML=`<div class="top"><div><button class="btn secondary mobileBack" onclick="page('dashboard')">← Dashboard</button><h1>Order PO</h1><p>Semua pesanan customer, dipisahkan berdasarkan Batch.</p></div><button class="btn" onclick="newOrder()">＋ Buat Order</button></div>

function renderOrders(){let q=(ordSearch?.value||'').toLowerCase(), st=ordStatus?.value||'', bt=ordBatch?.value||'';let arr=db.orders.filter(o=>{let s=status(o)[0];return(!st||s===st)&&(!bt||o.batchId===bt)&&(o.invoice+' '+customerName(o.customerId)+' '+batchName(o.batchId)+' '+(o.items||[]).map(i=>i.code).join(' ')).toLowerCase().includes(q)});ordTable.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Batch</th><th>Customer</th><th>Item</th><th>Total</th><th>Bayar</th><th>Status</th><th></th></tr></thead><tbody>${arr.slice().reverse().map(o=>{let t=orderTotals(o),s=status(o);return `<tr><td><b>${esc(o.invoice)}</b></td><td><span class="pill">${esc(batchName(o.batchId))}</span></td><td>${esc(customerName(o.customerId))}</td><td>${o.items.length} baris</td><td>${rupiah(t.total)}</td><td>${rupiah(paidFor(o.id))}</td><td><span class="pill ${s[1]}">${s[0]}</span></td><td><div class="actions"><button class="btn secondary" onclick="editOrder('${o.id}')">Buka</button><button class="btn secondary" onclick="receiveOrder('${o.id}')">📦 Barang Datang</button><button class="btn secondary" onclick="openInvoice('${o.id}')">Invoice</button><button class="btn secondary" onclick="addressPrint('${o.id}')">🖨 Alamat</button><button class="btn danger" onclick="deleteOrder('${o.id}')">Hapus</button></div></td></tr>`}).join('')||`<tr><td colspan="8" class="empty">Belum ada order.</td></tr>`}</tbody></table></div>`}

 <div class="formgrid"><div><label>Customer</label><select class="field" id="o_customer">${db.customers.map(c=>`<option value="${c.id}" ${c.id===o.customerId?'selected':''}>${esc(c.name)} — ${esc(c.wa)}</option>`).join('')}</select></div><div><label>Batch PO</label><select class="field" id="o_batch"><option value="">Tanpa Batch</option>${batchOptions(o.batchId||'')}</select></div><div class="full"><label>Invoice</label><input class="field" id="o_invoice" value="${esc(o.invoice||nextInvoice())}"></div></div>

function addItem(){document.getElementById('items').insertAdjacentHTML('beforeend',itemRow({qty:1,price:0,discount:0}))}
function receiveOrder(id){let o=db.orders.find(x=>x.id===id);showModal('Barang Datang — '+o.invoice,`<div class="notice">Masukkan <b>Qty Diterima</b>. Jika supplier kurang kirim / tidak dapat, tagihan customer otomatis dipotong sesuai harga barang. Data ini baru memengaruhi tagihan setelah disimpan.</div><div id="recv">${o.items.map((i,k)=>{let current=o.receivedSet?Number(i.received??0):Number(i.qty||0);return `<div class="itemrow" style="grid-template-columns:1.5fr .7fr .7fr 1fr"><div><label>Barang</label><div style="padding:11px 0"><b>${esc(i.code)}</b> ${esc(i.color)} ${esc(i.size)}</div></div><div><label>Pesan</label><input class="field" value="${i.qty}" disabled></div><div><label>Diterima</label><input class="field recv" data-i="${k}" type="number" min="0" max="${i.qty}" value="${current}"></div><div><label>Potongan</label><div style="padding:11px 0" id="disc${k}">${rupiah((i.qty-current)*i.price)}</div></div></div>`}).join('')}</div><div class="modalfoot"><button class="btn secondary" onclick="editOrder('${id}')">← Kembali ke Order</button><button class="btn" onclick="saveReceived('${id}')">Simpan & Potong Tagihan</button></div>`);document.querySelectorAll('.recv').forEach(x=>x.oninput=()=>{let k=x.dataset.i;let i=o.items[k];let r=Math.max(0,Math.min(i.qty,Number(x.value||0)));document.getElementById('disc'+k).textContent=rupiah((i.qty-r)*i.price)})}
function addPayment(id){let o=db.orders.find(x=>x.id===id),t=orderTotals(o),p=paidFor(id),s=t.total-p;showModal('Tambah Pembayaran',`<div class="notice">Tagihan saat ini <b>${rupiah(t.total)}</b> · Sudah dibayar <b>${rupiah(p)}</b> · Sisa <b>${rupiah(Math.max(0,s))}</b>${s<0?` · Lebih bayar <b>${rupiah(Math.abs(s))}</b>`:''}</div><label>Nominal pembayaran</label><input class="field" id="payAmount" type="number" value="${Math.max(0,s)}"><label style="margin-top:10px">Catatan</label><input class="field" id="payNote" placeholder="Pelunasan / Deposit / Tambahan"><div class="modalfoot"><button class="btn secondary" onclick="modal.classList.remove('show')">Tutup</button><button class="btn" onclick="savePayment('${id}')">Simpan Pembayaran</button></div>`)}
function editOrderView(o){return ''}
function orderDetail(id){return}
function productSearch(){document.getElementById('app').innerHTML=`<div class="top"><div><button class="btn secondary mobileBack" onclick="page('dashboard')">← Dashboard</button><h1>🔎 Cari Barang</h1><p>Cari kode barang untuk melihat customer mana saja yang memesan.</p></div></div><div class="card"><div class="toolbar"><input class="field search" id="productSearchInput" placeholder="Contoh: A01 / CNY04..." oninput="renderProductSearch()"></div><div id="productSearchResult"></div></div>`;renderProductSearch()}
function renderProductSearch(){let q=(document.getElementById('productSearchInput')?.value||'').trim().toLowerCase(),box=document.getElementById('productSearchResult');if(!box)return;if(!q){box.innerHTML=`<div class="empty">Ketik kode barang, misalnya <b>A01</b>, untuk melihat siapa saja yang order.</div>`;return}let rows=[];(db.orders||[]).forEach(o=>(o.items||[]).forEach(i=>{if(String(i.code||'').toLowerCase().includes(q)){rows.push({customer:customerName(o.customerId),invoice:o.invoice,color:i.color,size:i.size,code:i.code,qty:Number(i.qty||0),received:Number(i.received||0),status:status(o)[0]})}}));let totalQty=rows.reduce((a,r)=>a+r.qty,0),customers=[...new Set(rows.map(r=>r.customer))];box.innerHTML=rows.length?`<div class="notice"><b>${rows.length}</b> baris order ditemukan · <b>${customers.length}</b> customer · Total Qty Pesan <b>${totalQty}</b></div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Invoice</th><th>Kode</th><th>Warna</th><th>Size</th><th>Qty Pesan</th><th>Qty Diterima</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.customer)}</b></td><td>${esc(r.invoice)}</td><td><b>${esc(r.code)}</b></td><td>${esc(r.color||'-')}</td><td>${esc(r.size||'-')}</td><td>${r.qty}</td><td>${r.received}</td><td>${esc(r.status)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Tidak ada customer yang order kode <b>${esc(q)}</b>.</div>`}
function payments(){document.getElementById('app').innerHTML=`<div class="top"><div><button class="btn secondary mobileBack" onclick="page('dashboard')">← Dashboard</button><h1>Pembayaran</h1><p>Kelola DP, pelunasan, dan riwayat pembayaran.</p></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Tagihan</th><th>Bayar</th><th>Sisa</th><th>Lebih Bayar</th><th>Status</th><th></th></tr></thead><tbody>${db.orders.slice().reverse().map(o=>{let t=orderTotals(o),p=paidFor(o.id),s=status(o);return `<tr><td>${esc(o.invoice)}</td><td>${esc(customerName(o.customerId))}</td><td>${rupiah(t.total)}</td><td>${rupiah(p)}</td><td>${rupiah(Math.max(0,t.total-p))}</td><td>${rupiah(Math.max(0,p-t.total))}</td><td><span class="pill ${s[1]}">${s[0]}</span></td><td><button class="btn secondary" onclick="addPayment('${o.id}')">＋ Bayar</button></td></tr>`}).join('')||`<tr><td colspan="8" class="empty">Belum ada order.</td></tr>`}</tbody></table></div></div>`}
function batches(){document.getElementById('app').innerHTML=`<div class="top"><div><button class="btn secondary mobileBack" onclick="page('dashboard')">← Dashboard</button><h1>Batch PO</h1><p>Pisahkan pesanan berdasarkan batch supaya order supplier tidak tercampur.</p></div><button class="btn" onclick="batchForm()">＋ Buat Batch</button></div><div class="card"><div id="batchTable"></div></div>`;renderBatches()}
function renderBatches(){let arr=db.batches.slice().reverse();document.getElementById('batchTable').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Batch</th><th>Tanggal</th><th>Order</th><th></th></tr></thead><tbody>${arr.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td>${esc(b.date||'—')}</td><td>${batchCount(b.id)} order</td><td><div class="actions"><button class="btn secondary" onclick="batchForm(db.batches.find(x=>x.id==='${b.id}'))">Edit</button><button class="btn danger" onclick="deleteBatch('${b.id}')">Hapus</button></div></td></tr>`).join('')||`<tr><td colspan="4" class="empty">Belum ada Batch. Buat batch pertama untuk memisahkan PO.</td></tr>`}</tbody></table></div>`}
function batchForm(b={}){showModal(b.id?'Edit Batch':'Buat Batch',`<div class="formgrid"><div class="full"><label>Nama Batch</label><input class="field" id="b_name" placeholder="Contoh: September 2026 #1" value="${esc(b.name)}"></div><div><label>Tanggal Batch</label><input class="field" id="b_date" type="date" value="${esc(b.date||new Date().toISOString().slice(0,10))}"></div></div><div class="right" style="margin-top:18px"><button class="btn" onclick="saveBatch('${b.id||''}')">Simpan Batch</button></div>`) }
function reports(){document.getElementById('app').innerHTML=`<div class="top"><div><button class="btn secondary mobileBack" onclick="page('dashboard')">← Dashboard</button><h1>Laporan Supplier</h1><p>Rekap otomatis dari order customer, dengan status sudah / belum di-order ke supplier.</p></div><div class="actions"><button class="btn secondary" onclick="exportCSV()">⬇ Export CSV</button><button class="btn" onclick="printReport()">🖨 Print</button></div></div><div class="card"><div class="toolbar"><select class="field" style="max-width:240px" id="reportBatch" onchange="renderReport()"><option value="">Semua Batch</option>${batchOptions()}</select></div><div class="notice"><b>Qty Pesan</b> = total pesanan customer. <b>Sudah Order</b> = qty yang sudah ditandai dikirim ke supplier. <b>Belum Order</b> = tambahan yang masih harus dipesan. Contoh: sudah order 10 pcs, lalu ada tambahan 1 pcs → Belum Order menjadi 1 pcs.</div><div id="reportTable"></div></div>`;renderReport()}
function supplierKey(i){return [i.code||'',i.color||'',i.size||''].join('||')}
function reportData(){let map={},bt=reportBatch?.value||'';db.orders.filter(o=>!bt||o.batchId===bt).forEach(o=>o.items.forEach(i=>{let k=supplierKey(i);if(!map[k])map[k]={key:k,code:i.code,color:i.color,size:i.size,qty:0,ordered:0,ids:[]};map[k].qty+=Number(i.qty||0);if(i.supplierOrdered)map[k].ordered+=Number(i.qty||0);map[k].ids.push(i.id)}));return Object.values(map).map(x=>({...x,remaining:Math.max(0,x.qty-x.ordered)})).sort((a,b)=>a.code.localeCompare(b.code)||a.color.localeCompare(b.color)||a.size.localeCompare(b.size))}
async function toggleSupplierOrdered(key){let bt=reportBatch?.value||'';let targets=[];db.orders.filter(o=>!bt||o.batchId===bt).forEach(o=>o.items.forEach(i=>{if(supplierKey(i)===key)targets.push(i)}));if(!targets.length)return;let shouldOrder=targets.some(i=>!i.supplierOrdered);let ids=targets.map(i=>i.id);const {error}=await sb.from('order_items').update({supplier_ordered:shouldOrder}).in('id',ids);if(error)return alert('Gagal memperbarui status order supplier: '+error.message);await loadDB();renderReport()}
function renderReport(){let arr=reportData();reportTable.innerHTML=`<div class="tablewrap"><table><thead><tr><th>Kode</th><th>Warna</th><th>Size</th><th>Qty Pesan</th><th>Sudah Order</th><th>Belum Order</th><th>Status</th></tr></thead><tbody>${arr.map(x=>{let checked=x.remaining===0&&x.qty>0;return `<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.color)}</td><td>${esc(x.size)}</td><td>${x.qty}</td><td><label class="check"><input type="checkbox" ${checked?'checked':''} onchange="toggleSupplierOrdered(decodeURIComponent('${encodeURIComponent(x.key)}'))"> ${x.ordered}</label></td><td><b>${x.remaining}</b></td><td>${x.remaining===0?'<span class="pill">Sudah Order</span>':'<span class="pill warn">Harus Order '+x.remaining+' pcs</span>'}</td></tr>`}).join('')||`<tr><td colspan="7" class="empty">Belum ada data.</td></tr>`}</tbody></table></div>`}
function exportCSV(){let rows=[['Kode','Warna','Size','Qty Pesan','Sudah Order','Belum Order','Status']];reportData().forEach(x=>rows.push([x.code,x.color,x.size,x.qty,x.ordered,x.remaining,x.remaining?'Harus Order':'Sudah Order']));let csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='Laporan_Supplier.csv';a.click()}
function printReport(){let rows=document.getElementById('reportTable').innerHTML;let w=window.open('','_blank');if(!w)return alert('Browser memblokir jendela print. Silakan izinkan pop-up untuk mencetak.');w.document.write(`<html><head><title>Laporan Supplier</title><style>body{font:13px Arial;padding:25px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}.pill{padding:4px 8px;border-radius:9px;background:#eef2eb}.warn{background:#fbf1df}</style></head><body><h2>Laporan Supplier</h2>${rows}</body></html>`);w.document.close();w.print()}
